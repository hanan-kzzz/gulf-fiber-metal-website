<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="heroDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091422"/>
      <stop offset="50%" stop-color="#0F2137"/>
      <stop offset="100%" stop-color="#162E4D"/>
    </linearGradient>
    <pattern id="cadGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334E68" stroke-width="0.5" stroke-opacity="0.35"/>
      <circle cx="30" cy="30" r="0.75" fill="#0D9488" opacity="0.4"/>
    </pattern>
    <linearGradient id="metalBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="grpPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="520" fill="url(#heroDarkBg)"/>
  <rect width="900" height="520" fill="url(#cadGrid)"/>

  <!-- Architectural Isometric Drawing: GRP Structural Cladding Facade Assembly -->
  <g transform="translate(480, 50)">
    <!-- Structural Steel Support Columns (Grey & Charcoal) -->
    <rect x="0" y="40" width="16" height="380" fill="url(#metalBeam)"/>
    <rect x="180" y="40" width="16" height="380" fill="url(#metalBeam)"/>
    <rect x="360" y="40" width="16" height="380" fill="url(#metalBeam)"/>
    
    <!-- Transverse Aluminum Mounting Rails -->
    <rect x="-30" y="90" width="430" height="12" fill="#475569" stroke="#64748B" stroke-width="1"/>
    <rect x="-30" y="210" width="430" height="12" fill="#475569" stroke="#64748B" stroke-width="1"/>
    <rect x="-30" y="330" width="430" height="12" fill="#475569" stroke="#64748B" stroke-width="1"/>

    <!-- GRP Facade Panels Floating Isometric Assembly -->
    <!-- Panel 1 (Top Left) -->
    <g transform="translate(10, 60)">
      <polygon points="0,0 155,0 155,115 0,115" fill="url(#grpPanelGrad)" stroke="#94A3B8" stroke-width="2"/>
      <path d="M15,15 L140,15 L140,100 L15,100 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
      <line x1="25" y1="35" x2="130" y2="35" stroke="#94A3B8" stroke-dasharray="3,3"/>
      <circle cx="8" cy="8" r="3" fill="#0D9488"/>
      <circle cx="147" cy="8" r="3" fill="#0D9488"/>
      <circle cx="8" cy="107" r="3" fill="#0D9488"/>
      <circle cx="147" cy="107" r="3" fill="#0D9488"/>
    </g>

    <!-- Panel 2 (Top Right - 3D Geometric Facade Feature) -->
    <g transform="translate(190, 60)">
      <polygon points="0,0 155,0 155,115 0,115" fill="url(#grpPanelGrad)" stroke="#94A3B8" stroke-width="2"/>
      <!-- 3D Pyramid / Diamond Facet Projection -->
      <polygon points="77,20 135,57 77,95 20,57" fill="#F1F5F9" stroke="#0D9488" stroke-width="1.5"/>
      <polygon points="77,20 135,57 77,57" fill="#E2E8F0"/>
      <polygon points="77,95 135,57 77,57" fill="#CBD5E1"/>
      <polygon points="20,57 77,95 77,57" fill="#94A3B8"/>
      <polygon points="20,57 77,20 77,57" fill="#F8FAFC"/>
    </g>

    <!-- Panel 3 (Bottom Left - Sectional Fluted Profile) -->
    <g transform="translate(10, 185)">
      <polygon points="0,0 155,0 155,115 0,115" fill="url(#grpPanelGrad)" stroke="#94A3B8" stroke-width="2"/>
      <!-- Fluted Grooves -->
      <line x1="25" y1="10" x2="25" y2="105" stroke="#94A3B8" stroke-width="3"/>
      <line x1="45" y1="10" x2="45" y2="105" stroke="#94A3B8" stroke-width="3"/>
      <line x1="65" y1="10" x2="65" y2="105" stroke="#94A3B8" stroke-width="3"/>
      <line x1="85" y1="10" x2="85" y2="105" stroke="#94A3B8" stroke-width="3"/>
      <line x1="105" y1="10" x2="105" y2="105" stroke="#94A3B8" stroke-width="3"/>
      <line x1="125" y1="10" x2="125" y2="105" stroke="#94A3B8" stroke-width="3"/>
      <!-- Technical Dimension Callout -->
      <line x1="-15" y1="0" x2="-15" y2="115" stroke="#0D9488" stroke-width="1"/>
      <text x="-25" y="62" fill="#14B8A6" font-family="monospace" font-size="9" text-anchor="middle" transform="rotate(-90,-25,62)">1200mm</text>
    </g>

    <!-- Panel 4 (Bottom Right - Perforated Mashrabiya Geometry) -->
    <g transform="translate(190, 185)">
      <polygon points="0,0 155,0 155,115 0,115" fill="url(#grpPanelGrad)" stroke="#94A3B8" stroke-width="2"/>
      <!-- Islamic / Geometric Perforation Array -->
      <g fill="#1E293B" stroke="#0D9488" stroke-width="0.75">
        <polygon points="45,30 55,40 45,50 35,40"/>
        <polygon points="75,30 85,40 75,50 65,40"/>
        <polygon points="105,30 115,40 105,50 95,40"/>
        <polygon points="45,65 55,75 45,85 35,75"/>
        <polygon points="75,65 85,75 75,85 65,75"/>
        <polygon points="105,65 115,75 105,85 95,75"/>
      </g>
    </g>

    <!-- Pillar Cover Cylindrical Wrap Assembly (Front Foreground) -->
    <g transform="translate(70, 290)">
      <ellipse cx="100" cy="20" rx="45" ry="12" fill="#334155" stroke="#0D9488" stroke-width="2"/>
      <path d="M55,20 L55,120 A45,12 0 0 0 145,120 L145,20 Z" fill="url(#grpPanelGrad)" stroke="#64748B" stroke-width="1.5"/>
      <line x1="100" y1="20" x2="100" y2="132" stroke="#0D9488" stroke-width="2" stroke-dasharray="4,2"/>
      <text x="100" y="145" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="9" font-weight="600" text-anchor="middle">GRP PILLAR COVER SHELL</text>
    </g>
  </g>

  <!-- Left Technical Annotation Overlay -->
  <g transform="translate(60, 90)">
    <!-- Blueprint Specs Block -->
    <rect x="0" y="0" width="340" height="340" fill="#0C1929" fill-opacity="0.85" rx="4" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="15" y="15" width="6" height="24" fill="#0D9488"/>
    <text x="32" y="32" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="15" font-weight="700" letter-spacing="0.5">COMPOSITE ARCHITECTURAL SPECS</text>
    <text x="32" y="47" fill="#0D9488" font-family="monospace" font-size="10" font-weight="600">RIYADH ENGINEERING WORKSHOP</text>

    <line x1="15" y1="62" x2="325" y2="62" stroke="#1E293B" stroke-width="1"/>

    <!-- Spec Metrics -->
    <g transform="translate(20, 75)">
      <text x="0" y="20" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Tensile Strength (ASTM D638)</text>
      <text x="280" y="20" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">85 - 110 MPa</text>

      <line x1="0" y1="35" x2="280" y2="35" stroke="#1E293B" stroke-width="0.5"/>

      <text x="0" y="55" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Deadweight Reduction vs Stone</text>
      <text x="280" y="55" fill="#14B8A6" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">-75%</text>

      <line x1="0" y1="70" x2="280" y2="70" stroke="#1E293B" stroke-width="0.5"/>

      <text x="0" y="90" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">UV &amp; Thermal Resistance</text>
      <text x="280" y="90" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">-20°C to +80°C</text>

      <line x1="0" y1="105" x2="280" y2="105" stroke="#1E293B" stroke-width="0.5"/>

      <text x="0" y="125" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Fire Rating Formulation</text>
      <text x="280" y="125" fill="#F8FAFC" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">Class 1 / Class A</text>

      <line x1="0" y1="140" x2="280" y2="140" stroke="#1E293B" stroke-width="0.5"/>

      <text x="0" y="160" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">Quality Verification</text>
      <text x="280" y="160" fill="#059669" font-family="monospace" font-size="12" font-weight="700" text-anchor="end">ISO Standard Audited</text>
    </g>

    <!-- Bottom Status Ribbon -->
    <rect x="15" y="275" width="310" height="40" fill="#16283D" rx="3" stroke="#0D9488" stroke-width="1"/>
    <circle cx="32" cy="295" r="4" fill="#0D9488"/>
    <text x="46" y="299" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Al Farazdaq St, Riyadh • B2B Fabrication</text>
  </g>
</svg>
