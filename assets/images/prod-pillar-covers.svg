<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPillar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="cylShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="20%" stop-color="#94A3B8"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="90%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sqShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgGradPillar)"/>

  <!-- Left: Cylindrical Column Cover Split Assembly -->
  <g transform="translate(60, 35)">
    <!-- Top Ellipse Rim -->
    <ellipse cx="100" cy="30" rx="65" ry="18" fill="#334155" stroke="#0D9488" stroke-width="2"/>
    <!-- Shell Half A (Left Half) -->
    <path d="M 35 30 L 35 240 A 65 18 0 0 0 100 258 L 100 48 A 65 18 0 0 1 35 30 Z" fill="url(#cylShade)" stroke="#475569" stroke-width="1.5"/>
    <!-- Interlocking Seam Line -->
    <line x1="100" y1="48" x2="100" y2="258" stroke="#0D9488" stroke-width="2.5" stroke-dasharray="6,3"/>
    <!-- Shell Half B (Right Half) -->
    <path d="M 100 48 L 100 258 A 65 18 0 0 0 165 240 L 165 30 A 65 18 0 0 1 100 48 Z" fill="url(#cylShade)" stroke="#475569" stroke-width="1.5"/>

    <text x="100" y="280" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CYLINDRICAL COLUMN WRAP</text>
    <text x="100" y="295" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">Ø300mm to Ø1800mm</text>
  </g>

  <!-- Right: Fluted & Square Column Cover System -->
  <g transform="translate(340, 35)">
    <!-- Square Profile Isometric -->
    <polygon points="30,30 150,15 190,40 70,55" fill="#CBD5E1" stroke="#334155" stroke-width="1.5"/>
    <polygon points="30,30 70,55 70,250 30,225" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/>
    <polygon points="70,55 190,40 190,235 70,250" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/>

    <!-- Fluted Vertical Grooves -->
    <line x1="85" y1="53" x2="85" y2="248" stroke="#475569" stroke-width="2"/>
    <line x1="105" y1="51" x2="105" y2="246" stroke="#475569" stroke-width="2"/>
    <line x1="125" y1="48" x2="125" y2="243" stroke="#475569" stroke-width="2"/>
    <line x1="145" y1="46" x2="145" y2="241" stroke="#475569" stroke-width="2"/>
    <line x1="165" y1="43" x2="165" y2="238" stroke="#475569" stroke-width="2"/>

    <text x="110" y="280" fill="#1E293B" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">FLUTED SQUARE CASING</text>
    <text x="110" y="295" fill="#64748B" font-family="monospace" font-size="10" text-anchor="middle">CONCEALED BRACKET FIXING</text>
  </g>

  <!-- Technical Spec Bar -->
  <rect x="20" y="325" width="560" height="38" fill="#0C1929" rx="4"/>
  <text x="35" y="348" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">GRP ARCHITECTURAL PILLAR COVERS</text>
  <text x="545" y="348" fill="#14B8A6" font-family="monospace" font-size="11" font-weight="600" text-anchor="end">INTERLOCKING SPLIT CASING</text>
</svg>
