<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHygienic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgHygienic)"/>

  <!-- Hygienic Cleanroom / Food Factory Wall Cladding System -->
  <g transform="translate(80, 40)">
    <!-- Rear Substrate Wall (Grey) -->
    <rect x="20" y="20" width="400" height="240" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
    
    <!-- Ultra-Smooth GRP Wall Panels (Clean White) -->
    <rect x="30" y="30" width="185" height="210" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" rx="2"/>
    <rect x="225" y="30" width="185" height="210" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" rx="2"/>

    <!-- Sanitary Expansion Joint Strip -->
    <rect x="216" y="25" width="8" height="220" fill="#0D9488"/>

    <!-- Integrated Curved Sanitary Floor Cove (Prevents Dirt Traps) -->
    <path d="M 20 240 Q 20 265, 45 265 L 420 265 L 420 250 L 30 250 Z" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="230" y="262" fill="#334155" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">PRE-MOLDED SANITARY COVE BASE</text>

    <!-- Hygienic Feature Badges -->
    <g transform="translate(50, 60)">
      <circle cx="20" cy="20" r="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5"/>
      <text x="20" y="24" fill="#0369A1" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ISO</text>
      <text x="45" y="24" fill="#1E293B" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Anti-Microbial &amp; Fungus Proof</text>
    </g>

    <g transform="translate(50, 110)">
      <circle cx="20" cy="20" r="14" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
      <text x="20" y="24" fill="#15803D" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">H₂O</text>
      <text x="45" y="24" fill="#1E293B" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Continuous 100°C Steam Washable</text>
    </g>

    <g transform="translate(50, 160)">
      <circle cx="20" cy="20" r="14" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
      <text x="20" y="24" fill="#B45309" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">pH</text>
      <text x="45" y="24" fill="#1E293B" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Chemical &amp; Acid Vapor Impervious</text>
    </g>
  </g>

  <!-- Technical Spec Bar -->
  <rect x="20" y="325" width="560" height="38" fill="#0C1929" rx="4"/>
  <text x="35" y="348" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SEAMLESS HYGIENIC WALL COVERINGS</text>
  <text x="545" y="348" fill="#14B8A6" font-family="monospace" font-size="11" font-weight="600" text-anchor="end">FOOD &amp; PHARMA CLEANROOM GRADE</text>
</svg>
