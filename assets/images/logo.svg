<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="gfmNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1828"/>
      <stop offset="100%" stop-color="#1B2D44"/>
    </linearGradient>
    <linearGradient id="gfmTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  
  <!-- Structural Hexagon & Woven Fiber Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagon Frame -->
    <polygon points="30,0 56,15 56,45 30,60 4,45 4,15" fill="url(#gfmNavy)" stroke="#0D9488" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Internal Fiber Strands Lattice -->
    <path d="M12,20 L48,40 M12,40 L48,20" stroke="#0D9488" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M30,5 L30,55" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <circle cx="30" cy="30" r="4.5" fill="#14B8A6"/>
    <!-- Metal Rivet Accents -->
    <circle cx="12" cy="18" r="1.5" fill="#CBD5E1"/>
    <circle cx="48" cy="18" r="1.5" fill="#CBD5E1"/>
    <circle cx="12" cy="42" r="1.5" fill="#CBD5E1"/>
    <circle cx="48" cy="42" r="1.5" fill="#CBD5E1"/>
  </g>

  <!-- Typography: Corporate Industrial English & Arabic -->
  <text x="80" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="800" fill="#0C1929" letter-spacing="-0.3">GULF FIBER &amp; METAL</text>
  <text x="80" y="50" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#0D9488" letter-spacing="1.8">COMPANY LIMITED • RIYADH KSA</text>
  <text x="80" y="66" font-family="'IBM Plex Sans Arabic', 'Tajawal', sans-serif" font-size="11" font-weight="600" fill="#475569">شركة الخليج للألياف والمعادن المحدودة</text>
</svg>
