<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradUnderpass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="canopyCurve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgGradUnderpass)"/>

  <!-- Left: Underpass Wall Cladding Acoustic Multi-layer Cross-Section -->
  <g transform="translate(40, 35)">
    <text x="120" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">UNDERPASS WALL CASING</text>
    
    <!-- Heavy Tunnel Concrete Substrate -->
    <rect x="20" y="35" width="200" height="220" fill="#475569" stroke="#64748B" stroke-width="2"/>
    <text x="120" y="145" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">CONCRETE RETAINING WALL</text>

    <!-- Sub-frame Brackets -->
    <rect x="220" y="60" width="20" height="15" fill="#CBD5E1"/>
    <rect x="220" y="140" width="20" height="15" fill="#CBD5E1"/>
    <rect x="220" y="220" width="20" height="15" fill="#CBD5E1"/>

    <!-- Acoustic Insulation Layer -->
    <rect x="240" y="45" width="20" height="200" fill="#F59E0B" fill-opacity="0.8"/>

    <!-- Outer GRP Anti-Graffiti Cladding Panel -->
    <rect x="260" y="35" width="15" height="220" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <!-- Exhaust Gas Resistance Arrows -->
    <path d="M 290 80 L 275 80" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="295" y="84" fill="#E2E8F0" font-family="monospace" font-size="9">EXHAUST GAS</text>

    <path d="M 290 140 L 275 140" stroke="#0D9488" stroke-width="2"/>
    <text x="295" y="144" fill="#E2E8F0" font-family="monospace" font-size="9">HIGH WASHING PSI</text>

    <path d="M 290 200 L 275 200" stroke="#3B82F6" stroke-width="2"/>
    <text x="295" y="204" fill="#E2E8F0" font-family="monospace" font-size="9">ACOUSTIC DAMPENING</text>
  </g>

  <!-- Right: Cantilevered Entrance Canopy Profile -->
  <g transform="translate(380, 45)">
    <text x="100" y="10" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CANTILEVER GRP CANOPY</text>
    
    <!-- Building Wall -->
    <rect x="20" y="25" width="25" height="230" fill="#0F1E2E"/>
    
    <!-- Curved Aerodynamic GRP Canopy Profile -->
    <path d="M 45 40 C 90 40, 160 70, 180 140 C 180 150, 160 145, 120 120 C 80 95, 55 90, 45 90 Z" fill="url(#canopyCurve)" stroke="#0D9488" stroke-width="2"/>
    
    <!-- High-Tensile Steel Tie Rod -->
    <line x1="45" y1="30" x2="160" y2="105" stroke="#CBD5E1" stroke-width="2.5"/>
    <circle cx="45" cy="30" r="3" fill="#0D9488"/>
    <circle cx="160" cy="105" r="3" fill="#0D9488"/>

    <text x="110" y="220" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">WIND LOAD: UP TO 140 KM/H</text>
    <text x="110" y="235" fill="#14B8A6" font-family="monospace" font-size="9" text-anchor="middle">UV GELCOAT PROTECTED</text>
  </g>

  <!-- Technical Spec Bar -->
  <rect x="20" y="325" width="560" height="38" fill="#0C1929" rx="4"/>
  <text x="35" y="348" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">CANOPIES &amp; TUNNEL CLADDING</text>
  <text x="545" y="348" fill="#14B8A6" font-family="monospace" font-size="11" font-weight="600" text-anchor="end">CIVIL INFRASTRUCTURE GRADE</text>
</svg>
