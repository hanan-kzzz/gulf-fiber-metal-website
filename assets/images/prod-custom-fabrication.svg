<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCustom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="mouldWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="turbineSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgCustom)"/>

  <!-- Left: Precision CNC Tooling Master Mould -->
  <g transform="translate(60, 40)">
    <text x="110" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">PRECISION CNC MASTER MOULD</text>
    
    <!-- Tooling Block Base -->
    <polygon points="20,70 140,40 210,75 90,105" fill="url(#mouldWood)" stroke="#D97706" stroke-width="1.5"/>
    <polygon points="20,70 90,105 90,210 20,175" fill="#78350F"/>
    <polygon points="90,105 210,75 210,180 90,210" fill="#451A03"/>

    <!-- Negative Mold Cavity Contours -->
    <ellipse cx="115" cy="72" rx="40" ry="18" fill="#1E293B" stroke="#0D9488" stroke-width="1.5"/>
    <path d="M 75 72 C 75 110, 155 110, 155 72" fill="#0C1929" stroke="#0D9488" stroke-width="1.5" stroke-dasharray="3,2"/>

    <text x="110" y="240" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">TOLERANCE ±0.5MM</text>
  </g>

  <!-- Right: Complex Curved Industrial Shroud / Aerodynamic Fairing -->
  <g transform="translate(320, 40)">
    <text x="130" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">CUSTOM COMPOSITE PART</text>

    <!-- Complex 3D Aerodynamic Shroud Part -->
    <path d="M 40 80 Q 140 30, 220 80 Q 240 160, 180 210 Q 90 230, 40 180 Z" fill="url(#turbineSheen)" stroke="#14B8A6" stroke-width="2"/>
    
    <!-- Ribbed Structural Flange -->
    <path d="M 60 95 Q 140 55, 200 95 Q 215 155, 170 190 Q 100 205, 60 165 Z" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- Metallic Mounting Bushings / Inserts -->
    <circle cx="80" cy="100" r="5" fill="#E2E8F0" stroke="#042F2E" stroke-width="1.5"/>
    <circle cx="180" cy="100" r="5" fill="#E2E8F0" stroke="#042F2E" stroke-width="1.5"/>
    <circle cx="150" cy="180" r="5" fill="#E2E8F0" stroke="#042F2E" stroke-width="1.5"/>
    <circle cx="85" cy="160" r="5" fill="#E2E8F0" stroke="#042F2E" stroke-width="1.5"/>

    <text x="130" y="240" fill="#14B8A6" font-family="monospace" font-size="10" text-anchor="middle">CAD/BIM COMPLIANT FABRICATION</text>
  </g>

  <!-- Technical Spec Bar -->
  <rect x="20" y="325" width="560" height="38" fill="#0C1929" rx="4"/>
  <text x="35" y="348" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">CUSTOM ENGINEERED GRP FABRICATIONS</text>
  <text x="545" y="348" fill="#14B8A6" font-family="monospace" font-size="11" font-weight="600" text-anchor="end">TURNKEY TOOLING &amp; PRODUCTION</text>
</svg>
