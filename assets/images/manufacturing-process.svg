<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="mfgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C1929"/>
      <stop offset="100%" stop-color="#16283D"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="url(#mfgBg)"/>

  <!-- Process Flow Header -->
  <text x="450" y="40" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">GULF FIBER &amp; METAL — GRP MANUFACTURING &amp; QA PROCESS</text>
  <line x1="200" y1="55" x2="700" y2="55" stroke="#0D9488" stroke-width="2"/>

  <!-- Step 1: Moulding & Tooling -->
  <g transform="translate(40, 80)">
    <rect x="0" y="0" width="145" height="230" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="4"/>
    <circle cx="72" cy="35" r="18" fill="#0D9488"/>
    <text x="72" y="41" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">01</text>
    <text x="72" y="80" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Tooling &amp; Mould</text>
    <line x1="20" y1="95" x2="125" y2="95" stroke="#334155" stroke-width="1"/>
    <!-- Graphic -->
    <rect x="25" y="110" width="95" height="40" fill="#78350F" stroke="#D97706" rx="2"/>
    <text x="72" y="134" fill="#FEF3C7" font-family="monospace" font-size="9" text-anchor="middle">CNC MASTER</text>
    <text x="72" y="175" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">CAD/BIM Patterns</text>
    <text x="72" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">±0.5mm Tolerance</text>
    <text x="72" y="215" fill="#14B8A6" font-family="monospace" font-size="9" text-anchor="middle">Release Agent</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 195 195 L 210 195" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Gelcoat Application -->
  <g transform="translate(220, 80)">
    <rect x="0" y="0" width="145" height="230" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="4"/>
    <circle cx="72" cy="35" r="18" fill="#0D9488"/>
    <text x="72" y="41" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">02</text>
    <text x="72" y="80" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">UV Gelcoat</text>
    <line x1="20" y1="95" x2="125" y2="95" stroke="#334155" stroke-width="1"/>
    <!-- Graphic -->
    <rect x="25" y="110" width="95" height="40" fill="#0284C7" stroke="#38BDF8" rx="2"/>
    <text x="72" y="134" fill="#FFFFFF" font-family="monospace" font-size="9" text-anchor="middle">0.5-0.8mm GEL</text>
    <text x="72" y="175" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Isophthalic Resin</text>
    <text x="72" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">UV-Stabilized</text>
    <text x="72" y="215" fill="#14B8A6" font-family="monospace" font-size="9" text-anchor="middle">RAL Custom Colors</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 375 195 L 390 195" stroke="#0D9488" stroke-width="2.5"/>

  <!-- Step 3: Lamination & Lay-up -->
  <g transform="translate(400, 80)">
    <rect x="0" y="0" width="145" height="230" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="4"/>
    <circle cx="72" cy="35" r="18" fill="#0D9488"/>
    <text x="72" y="41" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">03</text>
    <text x="72" y="80" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Lamination</text>
    <line x1="20" y1="95" x2="125" y2="95" stroke="#334155" stroke-width="1"/>
    <!-- Graphic -->
    <rect x="25" y="110" width="95" height="40" fill="#475569" stroke="#94A3B8" rx="2"/>
    <text x="72" y="134" fill="#FFFFFF" font-family="monospace" font-size="9" text-anchor="middle">E-GLASS REINFORCE</text>
    <text x="72" y="175" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Woven Roving Mat</text>
    <text x="72" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Hand &amp; Spray Lay-up</text>
    <text x="72" y="215" fill="#14B8A6" font-family="monospace" font-size="9" text-anchor="middle">Air-Roller Compaction</text>
  </g>

  <!-- Arrow 3-4 -->
  <path d="M 555 195 L 570 195" stroke="#0D9488" stroke-width="2.5"/>

  <!-- Step 4: Core & Curing -->
  <g transform="translate(580, 80)">
    <rect x="0" y="0" width="145" height="230" fill="#1E293B" stroke="#334155" stroke-width="1.5" rx="4"/>
    <circle cx="72" cy="35" r="18" fill="#0D9488"/>
    <text x="72" y="41" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">04</text>
    <text x="72" y="80" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Curing &amp; Core</text>
    <line x1="20" y1="95" x2="125" y2="95" stroke="#334155" stroke-width="1"/>
    <!-- Graphic -->
    <rect x="25" y="110" width="95" height="40" fill="#D97706" stroke="#FDE68A" rx="2"/>
    <text x="72" y="134" fill="#000000" font-family="monospace" font-size="9" text-anchor="middle">PU FOAM CORE</text>
    <text x="72" y="175" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Exothermic Curing</text>
    <text x="72" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Thermal Insulation</text>
    <text x="72" y="215" fill="#14B8A6" font-family="monospace" font-size="9" text-anchor="middle">Precision Demould</text>
  </g>

  <!-- Arrow 4-5 -->
  <path d="M 735 195 L 750 195" stroke="#0D9488" stroke-width="2.5"/>

  <!-- Step 5: Inspection & QA -->
  <g transform="translate(760, 80)">
    <rect x="0" y="0" width="115" height="230" fill="#1E293B" stroke="#0D9488" stroke-width="2" rx="4"/>
    <circle cx="57" cy="35" r="18" fill="#059669"/>
    <text x="57" y="41" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">05</text>
    <text x="57" y="80" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle">QA &amp; Tests</text>
    <line x1="15" y1="95" x2="100" y2="95" stroke="#334155" stroke-width="1"/>
    <!-- Graphic -->
    <rect x="15" y="110" width="85" height="40" fill="#059669" stroke="#6EE7B7" rx="2"/>
    <text x="57" y="134" fill="#FFFFFF" font-family="monospace" font-size="9" text-anchor="middle">PASSED QA</text>
    <text x="57" y="175" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Barcol Hardness</text>
    <text x="57" y="195" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Ultrasound Gauge</text>
    <text x="57" y="215" fill="#34D399" font-family="monospace" font-size="9" text-anchor="middle">Dispatch to Site</text>
  </g>
</svg>
