<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="panelSMC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgTank)"/>

  <!-- Sectional Panel GRP Water Tank Isometric Representation -->
  <g transform="translate(100, 30)">
    <!-- Concrete Foundation Plinth -->
    <polygon points="30,230 200,285 410,210 240,155" fill="#94A3B8" stroke="#64748B" stroke-width="1.5"/>
    <polygon points="30,230 200,285 200,300 30,245" fill="#64748B"/>
    <polygon points="200,285 410,210 410,225 200,300" fill="#475569"/>

    <!-- Tank Left Face (Panel Grid 3x2) -->
    <!-- Front Left Grid -->
    <g transform="translate(0, 0)">
      <!-- Panel Columns -->
      <polygon points="40,100 95,118 95,223 40,205" fill="url(#panelSMC)" stroke="#475569" stroke-width="1.5"/>
      <polygon points="95,118 150,136 150,241 95,223" fill="url(#panelSMC)" stroke="#475569" stroke-width="1.5"/>
      <polygon points="150,136 205,154 205,259 150,241" fill="url(#panelSMC)" stroke="#475569" stroke-width="1.5"/>
      <!-- Embossed Cross Rigidity Pattern on SMC Panels -->
      <line x1="45" y1="105" x2="90" y2="218" stroke="#94A3B8" stroke-width="1"/>
      <line x1="90" y1="123" x2="45" y2="200" stroke="#94A3B8" stroke-width="1"/>
      <line x1="100" y1="123" x2="145" y2="236" stroke="#94A3B8" stroke-width="1"/>
      <line x1="145" y1="141" x2="100" y2="218" stroke="#94A3B8" stroke-width="1"/>
      <line x1="155" y1="141" x2="200" y2="254" stroke="#94A3B8" stroke-width="1"/>
      <line x1="200" y1="159" x2="155" y2="236" stroke="#94A3B8" stroke-width="1"/>
    </g>

    <!-- Tank Right Face (Panel Grid 3x2) -->
    <g transform="translate(0, 0)">
      <polygon points="205,154 270,131 270,236 205,259" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
      <polygon points="270,131 335,108 335,213 270,236" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
      <polygon points="335,108 400,85 400,190 335,213" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>
    </g>

    <!-- Tank Roof Surface -->
    <polygon points="40,100 205,154 400,85 235,31" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
    <!-- Manhole Inspection Hatch -->
    <ellipse cx="230" cy="90" rx="20" ry="9" fill="#0D9488" stroke="#042F2E" stroke-width="1.5"/>
    <!-- Ventilation Cowl -->
    <rect x="140" y="70" width="12" height="15" fill="#64748B"/>
    <circle cx="146" cy="68" r="9" fill="#94A3B8"/>

    <!-- External Galvanized Steel Corner Angle Supports -->
    <line x1="205" y1="154" x2="205" y2="260" stroke="#0D9488" stroke-width="3.5"/>
    <line x1="40" y1="100" x2="40" y2="205" stroke="#0D9488" stroke-width="3.5"/>
    <line x1="400" y1="85" x2="400" y2="190" stroke="#0D9488" stroke-width="3.5"/>

    <!-- External Cat Ladder -->
    <line x1="70" y1="110" x2="70" y2="270" stroke="#334155" stroke-width="2"/>
    <line x1="82" y1="114" x2="82" y2="274" stroke="#334155" stroke-width="2"/>
    <line x1="70" y1="140" x2="82" y2="144" stroke="#334155" stroke-width="2"/>
    <line x1="70" y1="170" x2="82" y2="174" stroke="#334155" stroke-width="2"/>
    <line x1="70" y1="200" x2="82" y2="204" stroke="#334155" stroke-width="2"/>
    <line x1="70" y1="230" x2="82" y2="234" stroke="#334155" stroke-width="2"/>
  </g>

  <!-- Technical Spec Bar -->
  <rect x="20" y="325" width="560" height="38" fill="#0C1929" rx="4"/>
  <text x="35" y="348" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">GRP SECTIONAL PANEL WATER TANKS</text>
  <text x="545" y="348" fill="#14B8A6" font-family="monospace" font-size="11" font-weight="600" text-anchor="end">WRAS &amp; SASO COMPLIANT • 1KL TO 5,000KL</text>
</svg>
