<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDomes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1E2E"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="domeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="corniceStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgDomes)"/>

  <!-- Left: Sectional Architectural Dome -->
  <g transform="translate(60, 40)">
    <text x="120" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">SECTIONAL GRP DOME</text>
    
    <!-- Dome Base Ring Beam -->
    <ellipse cx="120" cy="220" rx="90" ry="20" fill="#334155" stroke="#64748B" stroke-width="1.5"/>
    
    <!-- Dome Hemispherical / Onion Contour -->
    <path d="M 30 220 C 30 110, 80 50, 120 40 C 160 50, 210 110, 210 220 Z" fill="url(#domeGold)" stroke="#D97706" stroke-width="2"/>
    
    <!-- Dome Segment Flange Seams -->
    <path d="M 65 228 C 75 140, 100 80, 120 40" fill="none" stroke="#78350F" stroke-width="1.5" stroke-dasharray="3,2"/>
    <path d="M 120 238 C 120 140, 120 80, 120 40" fill="none" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 175 228 C 165 140, 140 80, 120 40" fill="none" stroke="#78350F" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Crescent Finial on Apex -->
    <path d="M 120 40 L 120 15 M 115 15 A 8 8 0 1 1 125 15" stroke="#FDE68A" stroke-width="2" fill="none"/>

    <text x="120" y="260" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">UP TO 12M SPAN • 80% LIGHTER</text>
  </g>

  <!-- Right: Decorative Architectural Cornice Moulding Profile -->
  <g transform="translate(330, 40)">
    <text x="120" y="20" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ARCHITECTURAL CORNICE</text>
    
    <!-- Cornice Profile Contour -->
    <path d="M 20 60 L 190 60 L 190 85 C 160 90, 150 120, 120 125 C 100 130, 90 160, 60 165 L 20 165 Z" fill="url(#corniceStone)" stroke="#0D9488" stroke-width="2"/>
    
    <!-- Internal Steel Stiffener Lamination -->
    <rect x="35" y="80" width="15" height="60" fill="#475569" stroke="#0D9488" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="75" y="110" fill="#0D9488" font-family="'Inter', sans-serif" font-size="9" font-weight="600">STEEL STIFFENER</text>

    <!-- Wall Attachment Bracket -->
    <line x1="20" y1="90" x2="5" y2="90" stroke="#CBD5E1" stroke-width="3"/>
    <line x1="20" y1="140" x2="5" y2="140" stroke="#CBD5E1" stroke-width="3"/>

    <text x="110" y="220" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">CUSTOM CNC MOULD PROFILE</text>
    <text x="110" y="240" fill="#14B8A6" font-family="monospace" font-size="10" text-anchor="middle">ZERO RUST • ZERO CRACKING</text>
  </g>

  <!-- Technical Spec Bar -->
  <rect x="20" y="325" width="560" height="38" fill="#0C1929" rx="4"/>
  <text x="35" y="348" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">DOMES &amp; ARCHITECTURAL CORNICES</text>
  <text x="545" y="348" fill="#14B8A6" font-family="monospace" font-size="11" font-weight="600" text-anchor="end">ORNATE MOSQUE &amp; CIVIC FACADES</text>
</svg>
