<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="panelWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E0D8"/>
      <stop offset="50%" stop-color="#D6CEBE"/>
      <stop offset="100%" stop-color="#C2B7A3"/>
    </linearGradient>
    <pattern id="gridSubtle" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CBD5E1" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="url(#bgGrad1)"/>
  <rect width="600" height="380" fill="url(#gridSubtle)"/>

  <!-- Heritage / Traditional Cladding Module -->
  <g transform="translate(100, 40)">
    <!-- Rear Structural Framing -->
    <rect x="30" y="20" width="340" height="260" fill="#334155" rx="2"/>
    <line x1="140" y1="20" x2="140" y2="280" stroke="#475569" stroke-width="3"/>
    <line x1="260" y1="20" x2="260" y2="280" stroke="#475569" stroke-width="3"/>

    <!-- Front GRP Heritage Panels with Traditional Interlocking Geometry -->
    <g transform="translate(10, 10)">
      <!-- Panel 1 -->
      <rect x="30" y="20" width="160" height="110" fill="url(#panelWarm)" stroke="#8C7E6A" stroke-width="1.5" rx="3"/>
      <!-- Traditional Arch & Recessed Motif -->
      <path d="M 50 110 L 50 60 A 30 30 0 0 1 110 60 L 110 110 Z" fill="#B5A893" stroke="#8C7E6A" stroke-width="1"/>
      <circle cx="80" cy="50" r="10" fill="#998972"/>

      <!-- Panel 2 -->
      <rect x="200" y="20" width="160" height="110" fill="url(#panelWarm)" stroke="#8C7E6A" stroke-width="1.5" rx="3"/>
      <path d="M 220 110 L 220 60 A 30 30 0 0 1 280 60 L 280 110 Z" fill="#B5A893" stroke="#8C7E6A" stroke-width="1"/>
      <circle cx="250" cy="50" r="10" fill="#998972"/>

      <!-- Panel 3 -->
      <rect x="30" y="140" width="160" height="110" fill="url(#panelWarm)" stroke="#8C7E6A" stroke-width="1.5" rx="3"/>
      <line x1="45" y1="160" x2="175" y2="160" stroke="#8C7E6A" stroke-width="1.5"/>
      <line x1="45" y1="185" x2="175" y2="185" stroke="#8C7E6A" stroke-width="1.5"/>
      <line x1="45" y1="210" x2="175" y2="210" stroke="#8C7E6A" stroke-width="1.5"/>

      <!-- Panel 4 -->
      <rect x="200" y="140" width="160" height="110" fill="url(#panelWarm)" stroke="#8C7E6A" stroke-width="1.5" rx="3"/>
      <line x1="215" y1="160" x2="345" y2="160" stroke="#8C7E6A" stroke-width="1.5"/>
      <line x1="215" y1="185" x2="345" y2="185" stroke="#8C7E6A" stroke-width="1.5"/>
      <line x1="215" y1="210" x2="345" y2="210" stroke="#8C7E6A" stroke-width="1.5"/>
    </g>

    <!-- Engineering Callout Pins -->
    <circle cx="120" cy="180" r="4" fill="#0D9488"/>
    <circle cx="290" cy="180" r="4" fill="#0D9488"/>
  </g>

  <!-- Technical Spec Watermark / Label -->
  <rect x="20" y="325" width="560" height="38" fill="#0C1929" rx="4"/>
  <text x="35" y="348" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="12" font-weight="700">GRP TRADITIONAL CLADDING</text>
  <text x="545" y="348" fill="#14B8A6" font-family="monospace" font-size="11" font-weight="600" text-anchor="end">HERITAGE FACADE • CLASS A FIRE RATED</text>
</svg>
